name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: msbuild Tweaker.sln /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Tweaker-x64
          path: x64/Release/Tweaker.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tweaker-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Tweaker.exe
